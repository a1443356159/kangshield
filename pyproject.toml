[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kangshield"
version = "0.1.0"
description = "KangShield information-side V1 exploration pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
media = [
    "opencv-python-headless>=4.10,<5",
]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
kangshield-info = "kangshield.information.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
