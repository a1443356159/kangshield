[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kangshield"
version = "0.7.0"
description = "KangShield continuous per-person multidomain risk pilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
edge = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
    "av==18.0.0",
    "torch>=2.3",
    "ultralytics>=8.4,<9",
    "funasr>=1.3.22,<1.4",
]
dev = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
    "av==18.0.0",
    "pytest>=8,<10",
]
demo = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
    "av==18.0.0",
]

[project.scripts]
kangshield-info = "kangshield.information.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/kangshield/configs" = [
    "configs/v1-g4-event-candidate-policy.json",
    "configs/v1-g4-fall-features.json",
    "configs/v2-edge-segment-policy.json",
    "configs/v2-multidomain-risk-policy.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
